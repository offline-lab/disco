[project]

site_name        = "disco"
site_description = "Lightweight name service daemon for airgapped networks."
site_author      = "Offline Lab"
site_url         = "https://disco.offline-lab.com"
home_page_url    = "https://disco.offline-lab.com"
copyright        = "Copyright &copy; 2026 Offline Lab"

repo_name        = "offline-lab/disco"
repo_url         = "https://github.com/offline-lab/disco"
edit_uri         = "https://github.com/offline-lab/disco/edit/main/docs/"
site_dir         = "docs/public"
docs_dir         = "docs"

nav = [
  { "Home"            = "index.md" },
  { "Getting Started" = "getting-started.md" },
  { "Installation"    = "installation.md" },
  { "Configuration"   = "configuration.md" },
  { "CLI Reference"   = "cli.md" },
  { "NSS Module"      = "nss.md" },
  { "How-to" = [
    { "Enable DNS"        = "how-to/dns.md" },
    { "Enable Security"   = "how-to/security.md" },
    { "Time Sync"         = "how-to/time-sync.md" },
    { "GPS Broadcaster"   = "how-to/gps-broadcaster.md" },
    { "Static Hosts"      = "how-to/static-hosts.md" },
  ]},
  { "Architecture"    = "architecture.md" },
]

[project.theme]
language   = "en"
custom_dir = "docs/overrides"
features = [
    "content.code.copy",
    "content.tooltips",
    "navigation.footer",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.sections",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    "announce.dismiss",
]

[[project.theme.palette]]
scheme      = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme      = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/offline-lab"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
